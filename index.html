<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101b2c">
<title>UPSHIFT — Parkour playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#f3f5ed;--muted:#a9b5b4;--lime:#d7ff70;--orange:#ff875b;--panel:rgba(13,25,39,.79)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b2c;color:var(--ink);font-family:Outfit,system-ui,sans-serif}body{touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.grain{position:absolute;inset:0;pointer-events:none;opacity:.1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E")}.topbar{position:absolute;top:24px;left:28px;right:28px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.brand{display:flex;align-items:center;gap:11px}.brandmark{width:37px;height:37px;border:1px solid rgba(215,255,112,.65);border-radius:11px;display:grid;place-items:center;color:var(--lime);font-weight:800;font-size:19px;transform:rotate(-4deg)}.brandname{font-size:13px;font-weight:800;letter-spacing:.18em}.brandtag{font:9px 'DM Mono',monospace;color:#9ba9ad;letter-spacing:.16em;margin-top:3px}.hud{display:flex;gap:9px}.pill{padding:10px 14px;border:1px solid rgba(221,235,236,.15);background:var(--panel);border-radius:12px;backdrop-filter:blur(14px);font:10px 'DM Mono',monospace;color:#aab8bc;letter-spacing:.1em}.pill strong{font:600 14px Outfit;color:#fff;letter-spacing:0;margin-left:6px}.pill .lime{color:var(--lime)}.bottom{position:absolute;left:28px;right:28px;bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}.help{display:flex;gap:7px;align-items:center;flex-wrap:wrap;max-width:65%}.key{height:27px;min-width:28px;padding:0 8px;display:inline-grid;place-items:center;border:1px solid rgba(229,241,239,.22);border-bottom-width:2px;border-radius:7px;background:rgba(15,28,42,.73);color:#eaf1e9;font:10px 'DM Mono',monospace}.hint{font:10px 'DM Mono',monospace;color:#b1c0c0;margin-right:8px}.objective{font:10px 'DM Mono',monospace;color:#aab8bc;letter-spacing:.12em;text-align:right}.objective b{display:block;color:var(--lime);font:600 12px Outfit;letter-spacing:.08em;margin-top:5px}.toast{position:absolute;top:22%;left:50%;transform:translate(-50%,-8px);padding:10px 16px;border:1px solid rgba(215,255,112,.35);border-radius:999px;background:rgba(12,24,36,.88);color:var(--lime);font:10px 'DM Mono',monospace;letter-spacing:.12em;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.touch{display:none;position:absolute;inset:auto 18px 26px;justify-content:space-between;align-items:flex-end;pointer-events:none}.touchgroup{display:flex;gap:9px;pointer-events:auto}.touch button{width:54px;height:54px;border-radius:17px;border:1px solid rgba(233,245,242,.23);background:rgba(13,25,39,.72);color:#f3f5ed;font:600 18px Outfit;backdrop-filter:blur(10px);touch-action:none}.touch button:active,.touch button.on{background:rgba(215,255,112,.2);border-color:var(--lime);color:var(--lime)}@media(max-width:700px){.topbar{top:14px;left:15px;right:15px}.brandmark{width:33px;height:33px}.brandname{font-size:11px}.brandtag{font-size:8px}.hud{gap:5px}.pill{padding:8px 9px;font-size:8px}.pill strong{font-size:12px}.bottom{left:16px;right:16px;bottom:15px}.help{max-width:54%;gap:5px}.hint{font-size:8px;margin-right:3px}.key{height:23px;min-width:24px;font-size:9px;padding:0 5px}.objective{font-size:8px}.objective b{font-size:10px}.touch{display:flex}.bottom{bottom:94px}.toast{top:17%}}
</style>
</head>
<body>
<canvas id="game" aria-label="2D parkour playground"></canvas><div class="grain"></div>
<div class="topbar"><div class="brand"><div class="brandmark">↗</div><div><div class="brandname">UPSHIFT</div><div class="brandtag">PARKOUR PLAYGROUND</div></div></div><div class="hud"><div class="pill">DIST<strong id="distance">000</strong></div><div class="pill">FLOW<strong class="lime" id="flow">×1.0</strong></div><div class="pill">TOKENS<strong class="lime" id="tokens">00</strong></div></div></div>
<div class="toast" id="toast">NICE LINE · FLOW INCREASED</div>
<div class="bottom"><div class="help"><span class="key">A</span><span class="key">D</span><span class="hint">MOVE</span><span class="key">SPACE</span><span class="hint">JUMP</span><span class="key">SHIFT</span><span class="hint">RUN</span><span class="key">↓</span><span class="hint">SLIDE</span><span class="key">W</span><span class="hint">CLIMB</span><span class="key">M</span><span class="hint">MAP</span></div><div class="objective">THE CITY IS YOURS<b>FIND YOUR OWN LINE　↗</b></div></div>
<div class="touch"><div class="touchgroup"><button data-key="a">←</button><button data-key="d">→</button></div><div class="touchgroup"><button data-key="shift" aria-label="run">R</button><button data-key="w">↑</button><button data-key=" " aria-label="jump">↟</button><button data-key="s">↓</button></div></div>
<script src="game.js"></script>
</body></html>
